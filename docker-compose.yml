services:
  backend-flask:
    build:
      context: ./backend-flask
      dockerfile: Dockerfile
    container_name: collector-backend-flask
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - FLASK_ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///dev.db
      - JWT_SECRET=your-super-secure-jwt-secret-key-here
      - FRONTEND_URL=${FRONTEND_URL}
      - BASE_URL=${BASE_URL}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # SendGrid Email
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      # S3 / MinIO (inside Docker network, use service name)
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET_NAME=artworks
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      # Ollama (running natively on host machine)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma:2b
      # Tell HuggingFace libraries not to hit the internet at runtime.
      # The model is downloaded during docker build and lives in the image layer.
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./backend-flask:/app
      - flask_db:/app/instance
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: collector-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
  flask_db:
